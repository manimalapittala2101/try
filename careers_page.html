<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <!-- Latest compiled and minified CSS (Bootstrap 5) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery library -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Latest compiled JavaScript (Bootstrap 5 Bundle with Popper) -->
<script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="contair-fluid">
        <header class="text-center bg-dark text-light py-3">
            <h1 class="display-6">Start your career with first step of Registration</h1>
        </header>
              
    </div>
<section class="container my-4 bg-dark w-50 text-light ">
    <form class="row g-3">
        <div class="col">
            <label for="First Name" class="form-label">First Name</label>
    <input type="text" class="form-control" placeholder="First name" required aria-label="First name">
  </div>
  <br>
  <div class="col">
    <label for="Last Name" class="form-label">Last Name</label>
    <input type="text" class="form-control" placeholder="Last name" required aria-label="Last name">
  </div>
  <br>
  <div class="md:col-6">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" required>
  </div>
  <br>
  <div class="md:col-6">
    <label for="p1" class="form-label">Password</label>
    <input type="password" class="form-control" id="p1" required>
  </div>
  <br>
  <div class="col-12">
    <label for="address" class="form-label">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="" >
  </div>
  <br>
  <div class="md:col-6">
    <label for="cityy" class="form-label">City</label>
    <input type="text" class="form-control" id="city" required>
  </div>
  <br>
  <div class="md:col-4">
    <label for="state" class="form-label">State</label>
    <select id="state" class="form-control">
      <option selected>Choose...</option>
      <option value="Telangana">Telangana</option>
      <option value="Andhra Pradesh">Andhra Pradhesh</option>

    </select>
  </div>
  
  <br>
  <div class="form-group">
    <label for="upload">Upload Resume / CV</label>
    <input type="file" class="form-control-file" id="upload" required>
  </div>
  <div class="form-group">
    <button  class="button btn-solid btn-success justify-self-start" type="submit">Submit form</button>
  </div>
  

</form>
</section>


</body>
</html>
